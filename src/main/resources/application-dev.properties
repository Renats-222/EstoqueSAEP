# Conex\u00e3o MySQL (Apontando para o seu IP do Docker)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:172.16.5.6}:3306/${MYSQL_DB:rsdvf_estoque}?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASS:senai}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

#Recria as tabelas e injeta os 3 registros obrigat\u00f3rios da prova
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:import.sql

# Logs detalhados para ajudar a debugar no Postman
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true