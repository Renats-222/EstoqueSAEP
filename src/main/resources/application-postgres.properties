# ===================================================================
# CONFIGURA\u00c7\u00c3O DA BASE DE DADOS (PostgreSQL / Docker Local)
# ===================================================================

# Leitura din\u00e2mica das vari\u00e1veis de ambiente com fallback para as suas credenciais
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:172.16.5.6}:${POSTGRES_PORT:5432}/${POSTGRES_DB:estoqueDB}?sslmode=disable
spring.datasource.username=${POSTGRES_USER:renato}
spring.datasource.password=${POSTGRES_PASSWORD:aluno6}

spring.jpa.properties.hibernate.default_schema=public

# Driver e Dialeto ajustados para PostgreSQL
#spring.datasource.driverClassName=org.postgresql.Driver
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Otimiza\u00e7\u00e3o do Pool de Conex\u00f5es (HikariCP)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# ===================================================================
# CONFIGURA\u00c7\u00d5ES DO HIBERNATE / JPA
# ===================================================================

# Cria/atualiza as tabelas automaticamente no Postgres
# op\u00e7\u00e3o create "d\u00e1 reset a cada inicializa\u00e7\u00e3o da aplica\u00e7\u00e3o. Cuidado. 
# troque para update.

spring.jpa.hibernate.ddl-auto=update

# Exibicao de SQL (ajustado para false para limpar os logs)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=true