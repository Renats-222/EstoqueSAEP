# Conex\u00e3o MySQL (O IP padr\u00e3o aqui pode ser o do servidor da escola, ex: 172.16.0.30)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:172.16.0.30}:3306/${MYSQL_DB:rsdvf_estoque}?useTimezone=true&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=${MYSQL_USER:rsdvf}
spring.datasource.password=${MYSQL_PASS:gmSenai}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Boas pr\u00e1ticas de PROD: NUNCA recria as tabelas. Apenas valida se elas existem.
spring.jpa.hibernate.ddl-auto=validate

# Logs desligados para economizar processamento e proteger queries sens\u00edveis
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false