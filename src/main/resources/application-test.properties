# Configura\u00e7\u00e3o do Banco H2 em Mem\u00f3ria para Testes
spring.datasource.url=jdbc:h2:mem:estoquedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Acess\u00edvel via navegador em localhost:8080/h2-console)
spring.h2.console.enabled=true

# Recria as tabelas em mem\u00f3ria e roda o import.sql
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:import.sql

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true