# Nome da Aplica\u00e7\u00e3o e Path Raiz
spring.application.name=estoque
server.servlet.context-path=/api

spring.output.ansi.enabled=always

# Configura\u00e7\u00e3o da Base de Dados MySQL (Seu banco oficial)
spring.datasource.url=jdbc:mysql://localhost:3306/rsdvf_estoque?useTimezone=true&serverTimezone=UTC
spring.datasource.username=rsdvf
spring.datasource.password=gmSenai
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configura\u00e7\u00e3o do Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL formatado no Console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true