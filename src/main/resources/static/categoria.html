<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>EstoqueControl - Categorias</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>EstoqueControl - Categorias</h1>

        <div id="container">
        </div>

        <script>
            async function carregarCategorias() {
                try {
                    const res = await fetch('/Natin/estoque/categorias');
                    const categorias = await res.json();

                    const html = categorias.map(item => `
                        <div>
                            <h3>${item.categoria}</h3>
                            <p>ID: ${item.id}</p>
                        </div>
                    `).join('');

                    document.getElementById("container").innerHTML = html;

                } catch (erro) {
                    console.error('Erro na requisição:', erro);
                }
            }

            carregarCategorias();
        </script>
    </body>
</html>
